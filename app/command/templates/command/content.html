{% if content %}
<section id="{{ content.slug }}" class="py-5">
    <div class="container">
        <h2 class="section-title text-center text-white-custom">{{ content.title }}</h2>
        <p class="text-center mb-5 text-white-custom">{{ content.desc }}</p>
        
        <div class="row g-4">
            {% for feature in content.features.all %}
            <div class="col-md-6 col-lg-3">
                <div class="card trainer-card h-100">
                    <div class="position-relative overflow-hidden">
                        {% if feature.src %}
                        <img src="{{ MEDIA_URL }}{{ feature.src }}" class="card-img-top trainer-image" alt="{% firstof feature.alt feature.name %}" loading="lazy" decoding="async">
                        {% endif %}
                        {% if feature.social %}
                        <div class="trainer-social">
                            <a href="{{ feature.social }}" class="social-icon text-white-custom" target="_blank" rel="noopener noreferrer" aria-label="Профиль тренера {{ feature.name }}"><i class="fab fa-vk"></i></a>
                        </div>
                        {% endif %}
                    </div>
                    <div class="card-body text-center">
                        <h5 class="card-title text-white-custom">{{ feature.name }}</h5>
                        <p class="trainer-specialty">{{ feature.status }}</p>
                        <p class="card-text text-white-custom">{{ feature.desc }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
