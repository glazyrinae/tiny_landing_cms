services:
  web:
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 60 tiny_cms.wsgi:application
    env_file:
      - ./.env.prod
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    environment:
      DJANGO_SETTINGS_MODULE: tiny_cms.configs.prod

  nginx:
    build: ./nginx
    depends_on:
      - web
    restart: unless-stopped
    volumes:
      - ./app/staticfiles:/var/www/static
      - ./media:/var/www/media
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      - "traefik.http.middlewares.fizruk-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.fizruk-redirect-to-https.redirectscheme.permanent=true"

      - "traefik.http.routers.fizruk-http.rule=Host(`fizruk-fitness.ru`) || Host(`www.fizruk-fitness.ru`)"
      - "traefik.http.routers.fizruk-http.entrypoints=web"
      - "traefik.http.routers.fizruk-http.middlewares=fizruk-redirect-to-https"
      - "traefik.http.routers.fizruk-http.service=fizruk"

      - "traefik.http.routers.fizruk-https.rule=Host(`fizruk-fitness.ru`) || Host(`www.fizruk-fitness.ru`)"
      - "traefik.http.routers.fizruk-https.entrypoints=websecure"
      - "traefik.http.routers.fizruk-https.tls=true"
      - "traefik.http.routers.fizruk-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fizruk-https.service=fizruk"

      - "traefik.http.services.fizruk.loadbalancer.server.port=80"
    networks:
      - traefik-public
      - app_network

  db:
    env_file:
      - ./.env.prod

networks:
  traefik-public:
    external: true
